# Local development stack: MySQL + Spring Boot backend + React frontend.
#   docker compose up --build
# Frontend: http://localhost  |  Backend: http://localhost:8080  |  MySQL: localhost:3306
# Local-only credentials - never reuse them anywhere else.
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: local-dev-password
      MYSQL_DATABASE: student_registration
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-plocal-dev-password"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: dockerfile
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: student_registration
      DB_USER: root
      DB_PASSWORD: local-dev-password
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile
      args:
        # In the cluster the Ingress routes /api to the backend (VITE_API_URL=/api).
        # Locally the browser talks to the backend port directly.
        VITE_API_URL: http://localhost:8080/api
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db-data:
