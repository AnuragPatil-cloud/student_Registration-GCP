server.port=8080

# =========================
# Database (Cloud SQL for MySQL on GCP)
# =========================
# In Kubernetes these values come from the Secret "student-registration-db-secret"
# (DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD).
# DB_USER and DB_PASSWORD have no defaults on purpose: the app refuses to start without them.
# TLS is negotiated automatically (Cloud SQL supports it); allowPublicKeyRetrieval lets
# MySQL 8.4's caching_sha2_password work if a connection ever falls back to plain text.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:student_registration}?allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# =========================
# JPA / Hibernate
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# =========================
# Actuator (health probes + Prometheus metrics)
# =========================
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
