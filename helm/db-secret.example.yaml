# NOT part of the Helm chart and NOT synced by Argo CD (it lives outside helm/student-registration).
# Copy to helm/db-secret.yaml (gitignored), fill in the values, and apply it once by hand:
#   kubectl create namespace student-registration
#   kubectl apply -f helm/db-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: student-registration-db-secret
  namespace: student-registration
type: Opaque
stringData:
  DB_HOST: "<cloud sql private ip: terraform output cloudsql_private_ip>"
  DB_PORT: "3306"
  DB_NAME: "student_registration"
  DB_USER: "studentadmin"
  DB_PASSWORD: "CHANGE_ME_STRONG_PASSWORD"
