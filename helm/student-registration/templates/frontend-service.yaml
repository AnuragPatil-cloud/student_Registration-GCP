apiVersion: v1
kind: Service
metadata:
  name: student-registration-frontend
  namespace: {{ .Values.namespace }}
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: {{ .Values.frontend.service.type }}
  selector:
    app: student-registration-frontend
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: 80
      protocol: TCP
